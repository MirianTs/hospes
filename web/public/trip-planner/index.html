<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospes · მოგზაურობის დამგეგმავი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --burgundy: #7A1F3D;
    --cream: #F8F1DE;
    --green: #2F5D3A;
    --gold: #D9A441;
    --ink: #2A2224;
    --muted: #7A6F68;
    --line: #E6DCC4;
    --card: #FFFCF4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--cream); }
  .app { display: grid; grid-template-columns: 430px 1fr; height: 100vh; }
  #map { height: 100%; background: #eee; }

  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--cream); border-right: 1px solid var(--line); }
  .scroll { overflow-y: auto; padding: 18px 20px 8px; flex: 1; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .brand img { width: 38px; height: 38px; object-fit: cover; object-position: top; border-radius: 10px; }
  .brand b { font-size: 17px; color: var(--green); }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .demo { font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--gold); border-radius: 99px; padding: 2px 8px; vertical-align: 2px; margin-left: 4px; }
  .back { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--green); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .soon { font-size: 12.5px; line-height: 1.4; color: #6B5320; background: #FBF0D2; border: 1px solid #EBD9A6; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }

  /* planner form */
  .planner { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field select { width: 100%; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; background: #F1E8D0; border-radius: 11px; padding: 4px; }
  .mode button { border: 0; border-radius: 8px; padding: 9px; font: inherit; font-size: 14px; font-weight: 600; background: none; color: var(--muted); cursor: pointer; }
  .mode button[aria-pressed="true"] { background: #fff; color: var(--burgundy); box-shadow: 0 1px 4px rgba(60,30,20,.12); }
  .mode button:disabled { opacity: .4; cursor: not-allowed; }
  .btn { width: 100%; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; font-size: 15px; background: var(--burgundy); color: #fff; cursor: pointer; }
  .btn:hover { background: #64182F; }
  .btn.ghost { background: var(--green); }
  .btn.ghost:hover { background: #244A2D; }

  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; color: var(--burgundy); }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11.5px; color: var(--muted); line-height: 1.3; display: block; }

  .guide { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .guide b { font-size: 14px; }
  .guide small { display: block; font-size: 12px; color: var(--muted); }
  .guide .price { margin-left: auto; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  input[type=checkbox] { accent-color: var(--burgundy); width: 16px; height: 16px; margin: 0; flex: none; }

  .day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .day.active { border-color: var(--day); box-shadow: 0 6px 18px rgba(60, 30, 20, .08); }
  .day-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; }
  .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--day); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .day-title { font-weight: 600; font-size: 15px; }
  .day-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .chev { margin-left: auto; flex: none; color: var(--muted); transition: transform .2s; }
  .day.active .chev { transform: rotate(180deg); }
  .day-body { display: none; padding: 0 14px 14px; }
  .day.active .day-body { display: block; }

  .profile { position: relative; margin: 2px 0 4px; }
  .profile svg { width: 100%; height: 74px; display: block; cursor: crosshair; }
  .profile .tip { position: absolute; top: -2px; font-size: 11px; background: var(--ink); color: #fff; padding: 2px 6px; border-radius: 6px; pointer-events: none; transform: translateX(-50%); white-space: nowrap; display: none; }

  .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; }
  .sight-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .sight-row:hover b { color: var(--burgundy); }
  .sight-row img, .sight-row .noimg { flex: none; width: 58px; height: 44px; border-radius: 8px; object-fit: cover; }
  .sight-row .noimg { background: #F1E8D0; display: grid; place-items: center; }
  .sight-row .noimg i { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); }
  .sight-row b { font-size: 13.5px; font-weight: 600; display: block; }
  .sight-row small { font-size: 12px; color: var(--muted); }

  .stay { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
  .stay > img { width: 100%; height: 110px; object-fit: cover; display: block; }
  .stay-in { padding: 10px 12px; }
  .stay-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 14px; }
  .stay small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
  .star { color: #C98A1E; }
  .lock { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11.5px; color: var(--green); background: #EAF1E6; border-radius: 99px; padding: 3px 9px; }

  .svc { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; cursor: pointer; }
  .svc:first-of-type { border-top: 0; }
  .svc .ico { flex: none; width: 30px; height: 30px; border-radius: 9px; background: #F1E8D0; display: grid; place-items: center; font-size: 15px; }
  .svc .who { display: block; font-size: 11.5px; color: var(--muted); }
  .svc .price { margin-left: auto; font-weight: 600; white-space: nowrap; }

  .total { border-top: 1px solid var(--line); padding: 12px 20px 16px; background: var(--cream); }
  .total-row { display: flex; align-items: baseline; justify-content: space-between; }
  .total-row b { font-size: 25px; color: var(--burgundy); }
  .split { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .note { font-size: 10.5px; color: var(--muted); margin-top: 9px; line-height: 1.4; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: .25s; z-index: 1000; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* map */
  .stop { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--burgundy); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--burgundy); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .stop.start { border-color: var(--green); color: var(--green); }
  .sight { width: 13px; height: 13px; background: var(--gold); border: 2px solid #fff; transform: rotate(45deg); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .sight.photo { width: 34px; height: 34px; transform: none; border-radius: 50%; background-size: cover; background-position: center; border: 3px solid #fff; }
  .svc-pin { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 13px; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .leaflet-tooltip.vlabel { font-family: inherit; font-weight: 600; font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .leaflet-tooltip.vlabel::before { display: none; }
  .leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; font-family: inherit; }
  .leaflet-popup-content { margin: 0; width: 250px !important; }
  .pop img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .pop div { padding: 10px 12px 12px; }
  .pop b { font-size: 14px; display: block; }
  .pop span { font-size: 12.5px; color: var(--muted); display: block; margin-top: 2px; }
  .pop small { font-size: 10px; color: #A59B92; display: block; margin-top: 6px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: 100dvh; }
    #map { order: -1; }
    .panel { border-right: 0; border-top: 1px solid var(--line); }
    .scroll { padding: 14px 16px 8px; }
    h1 { font-size: 21px; }
    .total { padding: 10px 16px 12px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
    .total-row { flex-direction: column; align-items: flex-start; }
    .total-row b { font-size: 22px; }
    .split, .note { display: none; }
    .total .btn { width: auto; padding: 12px 18px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="scroll">
      <div class="brand">
        <img src="logo.png" alt="Hospes">
        <div><b>Hospes <i class="demo">დემო</i></b><span>მოგზაურობის დამგეგმავი</span></div>
        <a class="back" id="back" href="../" hidden>← საიტზე</a>
      </div>
      <div class="soon">ეს სამომავლო ფუნქციის დემოა: ჯერ განვითარების ეტაპზეა და დაჯავშნა არ მუშაობს.</div>

      <form class="planner" id="planner">
        <div class="fields">
          <div class="field"><label for="from">საიდან</label>
            <select id="from">
              <option value="tbilisi">თბილისი</option>
              <option value="kutaisi">ქუთაისი</option>
              <option value="zugdidi">ზუგდიდი</option>
              <option value="mestia" selected>მესტია</option>
            </select></div>
          <div class="field"><label for="to">სადამდე</label>
            <select id="to">
              <option value="ushguli" selected>უშგული</option>
              <option value="mestia">მესტია</option>
            </select></div>
        </div>
        <div class="mode" role="group" aria-label="როგორ მიდიხარ">
          <button type="button" data-mode="walk" aria-pressed="true">🥾 ფეხით</button>
          <button type="button" data-mode="car" aria-pressed="false">🚙 მანქანით</button>
        </div>
        <button class="btn ghost" type="submit">დაგეგმე მოგზაურობა</button>
      </form>

      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
      <div class="stats" id="stats"></div>
      <div id="guide"></div>
      <div id="days"></div>
    </div>
    <div class="total">
      <div class="total-row"><span>სულ, 1 ადამიანზე</span><b id="total">0 ₾</b></div>
      <div class="split" id="split"></div>
      <button class="btn" id="book">მთელი მოგზაურობის დაჯავშნა</button>
      <div class="note">გზები და ბილიკები: OpenStreetMap · სიმაღლეები: Open-Meteo · ფოტოები: <a href="photos/credits.json" style="color:inherit">Wikimedia Commons</a> · სასტუმროები, გიდი, მომსახურება და ფასები სადემონსტრაციოა.</div>
    </div>
  </aside>
  <div id="map" role="region" aria-label="მარშრუტის რუკა"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="route-data.js"></script>
<script src="car-data.js"></script>
<script>
const WALK_COLORS = ["#7A1F3D", "#C98A1E", "#2F5D3A", "#3A6EA5"];
const CAR_COLOR = "#48566A";
const COMMISSION = 0.08;
const V = window.VILLAGES, P = window.PLACES, TREK = window.ROUTE_DAYS, CAR = window.CAR_LEGS;
const NAMES = { tbilisi: "თბილისი", kutaisi: "ქუთაისი", zugdidi: "ზუგდიდი", mestia: "მესტია", ushguli: "უშგული" };
const TRANSFER_PRICE = { tbilisi: 90, kutaisi: 60, zugdidi: 40 };

const fmt = n => Math.round(n).toLocaleString("en-US");
const ord = n => n === 1 ? "1-ლი" : `მე-${n}`;   // 1-ლი, მე-2, მე-3
const dur = min => { const h = Math.floor(min / 60), m = Math.round(min % 60 / 10) * 10; return m ? `${h} სთ ${m} წთ` : `${h} სთ`; };

// ---------- demo content (stays, services, sights). Trail and road numbers are real.
const STAYS = {
  mestia:   { name: "მესტიის საოჯახო სასტუმრო", price: 90, box: true,  photo: "mestia",  rating: 4.8, reviews: 41 },
  zhabeshi: { name: "ჟაბეშის საოჯახო სასტუმრო", price: 80, box: true,  photo: null,      rating: 4.7, reviews: 18 },
  adishi:   { name: "ადიშის საოჯახო სასტუმრო",  price: 85, box: true,  photo: "adishi",  rating: 4.9, reviews: 27 },
  iprari:   { name: "იფრარის საოჯახო სასტუმრო", price: 80, box: false, photo: "iprari",  rating: 4.6, reviews: 12 },
  ushguli:  { name: "უშგულის საოჯახო სასტუმრო", price: 95, box: true,  photo: "ushguli", rating: 4.8, reviews: 36 },
};
const S = {
  mestiaTowers: { name: "მესტიის კოშკები და სვანეთის მუზეუმი", desc: "შუა საუკუნეების სვანური კოშკები", photo: "mestia", at: V.Mestia },
  enguri: { name: "ენგურის კაშხალი", desc: "271 მ სიმაღლის თაღოვანი კაშხალი, გზად", at: [42.7594, 42.0325] },
  forest: { name: "ტყის ბილიკი და ხედი უშბაზე", desc: "დღის უმაღლესი წერტილი", photo: "trail", atMax: true },
  ridge: { name: "ქედის თავი", desc: "ხედი ტეტნულდის მყინვარებზე", atMax: true },
  adishi: { name: "ადიში", desc: "შუა საუკუნეების სოფელი 2,100 მ-ზე", photo: "adishi", at: V.Adishi },
  crossing: { name: "ადიშჭალას გადასასვლელი", desc: "მდინარეს ცხენით ან ფეხით გადადიხარ", atKm: 4.5 },
  pass: { name: "ჩხუნდერის უღელტეხილი", desc: "ადიშის მყინვარის ხედი", photo: "glacier", atMax: true },
  khalde: { name: "ხალდე", desc: "1876 წლის აჯანყების სოფლის ნანგრევები", photo: "khalde", at: V.Khalde },
  iprari: { name: "იფრარი", desc: "XI საუკუნის ეკლესია თევდორეს ფრესკებით", photo: "iprari", at: V.Iprari },
  chazhashi: { name: "ჩაჟაშის კოშკები", desc: "UNESCO-ს მსოფლიო მემკვიდრეობა", photo: "chazhashi", at: V.Chazhashi },
  ushguli: { name: "უშგული", desc: "ხედი შხარაზე, საქართველოს უმაღლეს მწვერვალზე", photo: "ushguli", at: V.Ushguli },
};
const svc = (ico, name, who, price, on, near) => ({ ico, name, who, price, on: !!on, near: !!near });
const SV = {
  supra: () => svc("🍽", "სვანური სუფრა: კუბდარი, ჩვიშტარი", "მასპინძელი", 30, false),
  lunch: () => svc("🥪", "საგზალი მეორე დღისთვის", "მასპინძელი", 15, true),
  gear: () => svc("🎒", "სალაშქრო აღჭურვილობის გაქირავება", "მაღაზია მესტიაში", 25, false, true),
  salt: () => svc("🧂", "სვანური მარილის მასტერკლასი", "მეზობელი ოჯახი", 35, false, true),
  bagAdishi: () => svc("🐎", "ბარგის გადატანა ცხენით ადიშამდე", "მეზობელი, ცხენის პატრონი", 60, false, true),
  bagIprari: () => svc("🐎", "ბარგის გადატანა ცხენით იფრარამდე", "მეზობელი, ცხენის პატრონი", 60, false, true),
  cheese: () => svc("🧀", "სვანური ყველის დეგუსტაცია ფერმაში", "მეზობელი ფერმერი", 20, false, true),
  river: () => svc("🐎", "მდინარის გადაკვეთა ცხენით", "ადიშელი მეცხენე", 40, true),
  passGuide: () => svc("🧭", "მთის გიდი უღელტეხილამდე", "ადგილობრივი გიდი", 120, false),
  rakhi: () => svc("🥃", "სახლის არყის დეგუსტაცია", "მასპინძელი", 20, false),
  jeep: () => svc("🚙", "ჯიპით დაბრუნება მესტიაში", "ადგილობრივი მძღოლი", 60, true, true),
  shkhara: () => svc("🐎", "ცხენით ტური შხარის მყინვარამდე", "მასპინძლის ძმა", 80, false, true),
  museum: () => svc("🏛", "ეთნოგრაფიული მუზეუმი კოშკში", "უშგულის თემი", 10, false, true),
};

function buildStages(from, to, mode) {
  const stages = [];
  if (from !== "mestia") {
    const leg = CAR[`${from}-mestia`];
    const services = [SV.supra(), SV.salt()];
    if (mode === "walk") services.unshift(
      svc("🚐", `ტრანსფერი: ${NAMES[from]} → მესტია`, "ადგილობრივი მძღოლი", TRANSFER_PRICE[from], true), SV.gear());
    stages.push({ kind: "car", from: NAMES[from], to: "მესტია", ...leg, sights: [S.enguri, S.mestiaTowers], stay: STAYS.mestia, services });
  }
  if (to === "ushguli" && mode === "walk") {
    const plan = [
      { to: "ჟაბეში", sights: from === "mestia" ? [S.mestiaTowers, S.forest] : [S.forest], stay: STAYS.zhabeshi, services: [SV.lunch(), SV.supra(), SV.bagAdishi()] },
      { to: "ადიში", sights: [S.ridge, S.adishi], stay: STAYS.adishi, services: [SV.lunch(), SV.bagIprari(), SV.cheese()] },
      { to: "იფრარი", sights: [S.crossing, S.pass, S.khalde], stay: STAYS.iprari, services: [SV.river(), SV.passGuide(), SV.rakhi()] },
      { to: "უშგული", sights: [S.chazhashi, S.ushguli], stay: STAYS.ushguli, services: [SV.jeep(), SV.shkhara(), SV.supra(), SV.museum()] },
    ];
    let prev = "მესტია";
    plan.forEach((p, i) => { stages.push({ kind: "walk", from: prev, ...p, ...TREK[i] }); prev = p.to; });
  }
  if (to === "ushguli" && mode === "car") {
    stages.push({ kind: "car", from: "მესტია", to: "უშგული", ...CAR["mestia-ushguli"],
      sights: from === "mestia" ? [S.mestiaTowers, S.iprari, S.chazhashi, S.ushguli] : [S.iprari, S.chazhashi, S.ushguli],
      stay: STAYS.ushguli, services: [SV.shkhara(), SV.supra(), SV.museum(), SV.rakhi()] });
  }
  let walkN = 0;
  stages.forEach(s => {
    s.color = s.kind === "walk" ? WALK_COLORS[walkN++ % 4] : CAR_COLOR;
    s.sights = s.sights.map(x => {   // put each sight on this stage's line
      const o = { ...x };
      if (x.atMax && s.ele) { const k = s.ele.indexOf(Math.max(...s.ele)); o.pos = s.line[k]; o.desc += ` · ${fmt(s.ele[k])} მ`; }
      else if (x.atKm != null && s.dist) o.pos = s.line[s.dist.findIndex(v => v >= x.atKm)];
      else o.pos = x.at;
      return o;
    });
  });
  return stages;
}

// ---------- map
const map = L.map("map", { zoomControl: false, zoomSnap: 0.25 });
L.control.zoom({ position: "topright" }).addTo(map);
const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  maxZoom: 17, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, © <a href="https://opentopomap.org">OpenTopoMap</a>'
}).addTo(map);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
});
L.control.layers({ "რელიეფი": topo, "ქუჩები": osm }, null, { position: "topright" }).addTo(map);
const layer = L.featureGroup().addTo(map);
const hoverDot = L.circleMarker([0, 0], { radius: 7, color: "#fff", weight: 3, fillColor: "#2A2224", fillOpacity: 1 });
const divIcon = (html, size) => L.divIcon({ className: "", html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });

let CREDITS = {};
fetch("photos/credits.json").then(r => r.json()).then(c => { CREDITS = c; }).catch(() => {});
function popupHtml(s) {
  const c = CREDITS[s.photo];
  return `<div class="pop">${s.photo ? `<img src="photos/${s.photo}.jpg" alt="">` : ""}<div><b>${s.name}</b><span>${s.desc}</span>
    ${c ? `<small>ფოტო: ${c.author}, ${c.license}, Wikimedia Commons</small>` : ""}</div></div>`;
}

// ---------- state + render
let state = { from: "mestia", to: "ushguli", mode: "walk" };
let stages = [], lines = [], allBounds, guideOn = false;
const GUIDE = { name: "ლევანი", per: 150 };
const daysEl = document.getElementById("days");

function profileSvg(d, color) {
  const W = 300, H = 70, PAD = 4;
  const lo = Math.min(...d.ele) - 40, hi = Math.max(...d.ele) + 40, km = d.dist[d.dist.length - 1];
  const x = v => PAD + (v / km) * (W - 2 * PAD), y = e => H - PAD - ((e - lo) / (hi - lo)) * (H - 2 * PAD);
  const pts = d.dist.map((v, k) => `${x(v).toFixed(1)},${y(d.ele[k]).toFixed(1)}`);
  return `<div class="profile"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="სიმაღლის პროფილი">
    <path d="M${x(0)},${H} L${pts.join(" L")} L${x(km)},${H} Z" fill="${color}" fill-opacity=".14"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line class="cursor" y1="0" y2="${H}" stroke="#2A2224" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
  </svg><div class="tip"></div></div>`;
}

function render() {
  stages = buildStages(state.from, state.to, state.mode);
  layer.clearLayers(); daysEl.innerHTML = ""; lines = []; guideOn = false;

  // header
  const walk = stages.filter(s => s.kind === "walk"), car = stages.filter(s => s.kind === "car");
  const walkKm = walk.reduce((a, s) => a + s.km, 0), carKm = car.reduce((a, s) => a + s.km, 0);
  document.getElementById("title").textContent = `${NAMES[state.from]} → ${NAMES[state.to]}`;
  document.getElementById("sub").textContent = `${stages.length} დღე · ${stages.length} ღამე საოჯახო სასტუმროებში · ${state.mode === "walk" ? "ფეხით" : "მანქანით"}`;
  const tiles = walk.length
    ? [[`${walkKm.toFixed(0)} კმ`, "ფეხით"], [`+${fmt(walk.reduce((a, s) => a + s.up, 0))} მ`, "ჯამური აღმართი"],
       carKm ? [`${fmt(carKm)} კმ`, "მანქანით მესტიამდე"] : [`${fmt(Math.max(...walk.flatMap(s => s.ele)))} მ`, "უმაღლესი წერტილი"]]
    : [[`${fmt(carKm)} კმ`, "მანქანით"], [dur(car.reduce((a, s) => a + s.min, 0)), "საჭესთან"], [`${stages.length}`, "ღამე"]];
  document.getElementById("stats").innerHTML = tiles.map(t => `<div class="stat"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("");

  // guide (walking trips)
  document.getElementById("guide").innerHTML = walk.length ? `
    <label class="guide"><input type="checkbox" id="guideChk">
      <span class="avatar">ლ</span>
      <span><b>${GUIDE.name} · მთის გიდი <span class="star">★</span> 4.9</b><small>12 წელი სვანეთის ბილიკებზე · ქართული, ინგლისური, რუსული</small></span>
      <span class="price">${GUIDE.per} ₾/დღე</span></label>` : "";

  // map: lines, stops, sights, nearby services
  stages.forEach(s => L.polyline(s.line, { color: "#fff", weight: 10, opacity: .85, interactive: false }).addTo(layer));
  stages.forEach((s, i) => lines.push(L.polyline(s.line, { color: s.color, weight: 5, opacity: .95, lineJoin: "round", dashArray: s.kind === "car" ? "1 9" : null, lineCap: "round" })
    .on("click", () => select(i)).addTo(layer)));
  L.marker(stages[0].line[0], { icon: divIcon('<div class="stop start">▶</div>', 28) }).addTo(layer)
    .bindTooltip(`${stages[0].from} · დასაწყისი`, { permanent: true, direction: "left", offset: [-14, 0], className: "vlabel" });
  stages.forEach((s, i) => {
    const end = s.line[s.line.length - 1];
    L.marker(end, { icon: divIcon(`<div class="stop">${i + 1}</div>`, 28), zIndexOffset: 500 }).addTo(layer).on("click", () => select(i))
      .bindTooltip(`${s.to} · ${ord(i + 1)} ღამე`, { permanent: true, direction: "right", offset: [14, 0], className: "vlabel" });
    s.sights.forEach(x => {
      const html = x.photo ? `<div class="sight photo" style="background-image:url(photos/${x.photo}.jpg)"></div>` : '<div class="sight"></div>';
      x.marker = L.marker(x.pos, { icon: divIcon(html, x.photo ? 34 : 13) }).addTo(layer)
        .bindTooltip(x.name, { direction: "top", offset: [0, -14], className: "vlabel" })
        .bindPopup(() => popupHtml(x), { closeButton: false, offset: [0, -8] });
    });
    s.services.filter(v => v.near).forEach((v, k) => {
      const a = k * 2.1 + i, pos = [end[0] + Math.cos(a) * 0.0045, end[1] + Math.sin(a) * 0.0065];
      L.marker(pos, { icon: divIcon(`<div class="svc-pin">${v.ico}</div>`, 26) }).addTo(layer)
        .bindTooltip(`${v.name} · ${v.price} ₾`, { direction: "top", offset: [0, -12], className: "vlabel" });
    });
  });
  allBounds = L.featureGroup(lines).getBounds();

  // day cards
  stages.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "day";
    el.style.setProperty("--day", s.color);
    const h = s.kind === "walk" ? s.km / 4 + s.up / 600 : 0;
    const meta = s.kind === "walk"
      ? `🥾 ${s.km} კმ · ↑ ${fmt(s.up)} მ · ↓ ${fmt(s.down)} მ · ~${Math.round(h)}–${Math.round(h) + 1} სთ`
      : `🚙 ${fmt(s.km)} კმ · ~${dur(s.min)} მანქანით`;
    el.innerHTML = `
      <button class="day-head" type="button" aria-expanded="false">
        <div class="num">${i + 1}</div>
        <div><div class="day-title">${ord(i + 1)} დღე · ${s.from} → ${s.to}</div><div class="day-meta">${meta}</div></div>
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="day-body">
        ${s.ele ? profileSvg(s, s.color) : ""}
        <div class="label">სანახავი გზად</div>
        ${s.sights.map((x, k) => `<button class="sight-row" type="button" data-sight="${k}">
          ${x.photo ? `<img src="photos/${x.photo}.jpg" alt="" loading="lazy">` : '<span class="noimg"><i></i></span>'}
          <span><b>${x.name}</b><small>${x.desc}</small></span></button>`).join("")}
        <div class="label">${ord(i + 1)} ღამე</div>
        <div class="stay">
          ${s.stay.photo ? `<img src="photos/${s.stay.photo}.jpg" alt="" loading="lazy">` : ""}
          <div class="stay-in">
            <div class="stay-top"><div>${s.stay.name}<small><span class="star">★</span> ${s.stay.rating} (${s.stay.reviews} შეფასება) · ღამე, ვახშამი და საუზმე</small></div><div>${s.stay.price} ₾</div></div>
            ${s.stay.box ? '<span class="lock"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M4 5V3.5a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Hospes ყუთი: შედიხარ კოდით, მასპინძლის მოლოდინის გარეშე</span>' : ""}
          </div>
        </div>
        <div class="label">მასპინძლის და ახლომახლო მომსახურება</div>
        ${s.services.map((v, k) => `<label class="svc"><input type="checkbox" data-d="${i}" data-s="${k}" ${v.on ? "checked" : ""}>
          <span class="ico">${v.ico}</span><span>${v.name}<span class="who">${v.who}</span></span><span class="price">${v.price} ₾</span></label>`).join("")}
      </div>`;
    el.querySelector(".day-head").addEventListener("click", () => select(el.classList.contains("active") ? -1 : i));
    el.querySelectorAll(".sight-row").forEach(b => b.addEventListener("click", () => {
      const x = s.sights[b.dataset.sight];
      map.flyTo(x.pos, Math.max(map.getZoom(), 13.5), { duration: .6 });
      map.once("moveend", () => x.marker.openPopup());
    }));
    daysEl.appendChild(el);

    const svg = el.querySelector(".profile svg");
    if (svg) {
      const cur = svg.querySelector(".cursor"), tip = el.querySelector(".tip"), last = s.dist[s.dist.length - 1];
      svg.addEventListener("pointermove", e => {
        const r = svg.getBoundingClientRect();
        let k = s.dist.findIndex(v => v >= ((e.clientX - r.left) / r.width) * last); if (k < 0) k = s.dist.length - 1;
        const vx = 4 + (s.dist[k] / last) * 292;
        cur.setAttribute("x1", vx); cur.setAttribute("x2", vx); cur.style.display = "";
        tip.style.display = "block"; tip.style.left = (vx / 300 * 100) + "%";
        tip.textContent = `${fmt(s.ele[k])} მ · ${s.dist[k].toFixed(1)} კმ`;
        hoverDot.setLatLng(s.line[k]).addTo(map);
      });
      svg.addEventListener("pointerleave", () => { cur.style.display = "none"; tip.style.display = "none"; hoverDot.remove(); });
    }
  });

  map.fitBounds(allBounds, { padding: [50, 50] });
  updateTotal();
}

function updateTotal() {
  let sum = 0;
  stages.forEach(s => { sum += s.stay.price; s.services.forEach(v => { if (v.on) sum += v.price; }); });
  if (guideOn) sum += GUIDE.per * stages.filter(s => s.kind === "walk").length;
  const fee = sum * COMMISSION;
  document.getElementById("total").textContent = `${fmt(sum)} ₾`;
  document.getElementById("split").textContent = `მასპინძლებს, გიდებს და მძღოლებს რჩება ${fmt(sum - fee)} ₾ (92%) · Hospes: ${fmt(fee)} ₾ (8%)`;
}

function select(i) {
  [...daysEl.children].forEach((el, k) => {
    el.classList.toggle("active", k === i);
    el.querySelector(".day-head").setAttribute("aria-expanded", k === i);
  });
  lines.forEach((l, k) => l.setStyle({ opacity: i < 0 || k === i ? .95 : .3, weight: k === i ? 7 : 5 }));
  map.closePopup();
  if (i >= 0) {
    lines[i].bringToFront();
    map.flyToBounds(lines[i].getBounds(), { padding: [60, 60], duration: .6 });
    daysEl.children[i].scrollIntoView({ behavior: "smooth", block: "nearest" });
  } else map.flyToBounds(allBounds, { padding: [50, 50], duration: .6 });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800);
}

// ---------- planner form
const fromEl = document.getElementById("from"), toEl = document.getElementById("to");
const modeBtns = [...document.querySelectorAll(".mode button")];
let pendingMode = "walk";
function setMode(m) { pendingMode = m; modeBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m)); }
function syncForm() {   // walking is only offered where a trail exists: Mestia → Ushguli
  const walkOk = toEl.value === "ushguli";
  modeBtns[0].disabled = !walkOk;
  if (!walkOk) setMode("car");
}
modeBtns.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
fromEl.addEventListener("change", syncForm); toEl.addEventListener("change", syncForm);
document.getElementById("planner").addEventListener("submit", e => {
  e.preventDefault();
  if (fromEl.value === toEl.value) return toast("აირჩიე სხვადასხვა ადგილი");
  state = { from: fromEl.value, to: toEl.value, mode: pendingMode };
  render();
});

daysEl.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.d != null) { stages[t.dataset.d].services[t.dataset.s].on = t.checked; updateTotal(); }
});
document.getElementById("guide").addEventListener("change", e => { guideOn = e.target.checked; updateTotal(); });
document.getElementById("book").addEventListener("click", () => toast("სადემონსტრაციო ვერსია: დაჯავშნა ჯერ არ მუშაობს"));

// inside the Hospes site (/trip-planner/) show the way back
if (location.pathname.includes("trip-planner")) document.getElementById("back").hidden = false;

render();
</script>
</body>
</html>
