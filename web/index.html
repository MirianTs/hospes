<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#365e32" />
    <meta name="description" content="Hospes: უკონტაქტო ჯავშანი და ჩექინი საქართველოს მცირე სასტუმროებისა და გესთჰაუსებისთვის." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hospes · უკონტაქტო ჩექინი</title>
    <script>
      // Theme before the first paint: saved choice, else the system setting.
      try {
        var t = localStorage.getItem('hospes_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#121512';
        if (localStorage.getItem('hospes_lang') === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
